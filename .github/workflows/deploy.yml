name: CD - Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 수동 실행 가능

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2
      
      - name: Get GitHub Actions IP
        id: ip
        uses: haythem/public-ip@v1.2
      
      - name: Add GitHub Actions IP to Security Group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
        continue-on-error: true
      
      - name: Deploy notification
        run: |
          echo "🚀 Starting deployment: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Commit message: ${{ github.event.head_commit.message }}"
      
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "📦 Starting deployment..."
            echo "Current user: $(whoami)"
            echo "Current location: $(pwd)"
            echo "Home directory: $HOME"
            
            # Find project directory
            echo "🔍 Searching for project directory..."
            if [ -d "$HOME/scentence" ]; then
              PROJECT_DIR="$HOME/scentence"
              echo "✅ Found: $PROJECT_DIR"
            elif [ -d "$HOME/Scentence_aws" ]; then
              PROJECT_DIR="$HOME/Scentence_aws"
              echo "✅ Found: $PROJECT_DIR"
            elif [ -d "$HOME/Scentence_aws_test" ]; then
              PROJECT_DIR="$HOME/Scentence_aws_test"
              echo "✅ Found: $PROJECT_DIR"
            elif [ -d "/home/ubuntu/scentence" ]; then
              PROJECT_DIR="/home/ubuntu/scentence"
              echo "✅ Found: $PROJECT_DIR"
            else
              echo "❌ Project directory not found!"
              echo "Home directory contents:"
              ls -la "$HOME/" || true
              echo "Root directory contents:"
              ls -la / || true
              exit 1
            fi
            
            echo "📁 Moving to project directory: $PROJECT_DIR"
            cd "$PROJECT_DIR" || { echo "❌ cd failed!"; exit 1; }
            echo "✅ Moved successfully. Current location: $(pwd)"
            
            # Pull latest code
            echo "🔄 Fetching latest code..."
            git fetch origin || { echo "❌ git fetch failed!"; exit 1; }
            git reset --hard origin/main || { echo "❌ git reset failed!"; exit 1; }
            echo "✅ Code updated successfully"
            
            # Check .env file
            if [ ! -f .env ]; then
              echo "❌ .env file not found!"
              exit 1
            fi
            
            # Rebuild and deploy Docker images
            echo "🐳 Restarting Docker containers..."
            docker compose -f docker-compose.production.yml down || echo "⚠️ No existing containers"
            docker compose -f docker-compose.production.yml build --no-cache || { echo "❌ Docker build failed!"; exit 1; }
            docker compose -f docker-compose.production.yml up -d || { echo "❌ Docker start failed!"; exit 1; }
            echo "✅ Docker containers started successfully"
            
            # Check container status
            echo "✅ Deployment complete! Container status:"
            docker ps
            
            # Wait for health check
            echo "🏥 Waiting for health check..."
            sleep 30
            
            # Clean up old images
            echo "🧹 Cleaning up old Docker resources..."
            docker image prune -af --filter "until=24h"
      
      - name: Remove GitHub Actions IP from Security Group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
        continue-on-error: true
      
      - name: Health check
        run: |
          echo "🏥 Checking services health..."
          
          # Backend health check
          curl -f https://scentence.kro.kr/api/backend-openapi || exit 1
          echo "✅ Backend is healthy"
          
          # Scentmap health check
          curl -f https://scentence.kro.kr/api/scentmap-health || exit 1
          echo "✅ Scentmap is healthy"
          
          # Layering health check
          curl -f https://scentence.kro.kr/api/layering-health || exit 1
          echo "✅ Layering is healthy"
          
          echo "🎉 All services are running!"
      
      - name: Deployment success notification
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "URL: https://scentence.kro.kr"
          echo "Commit: ${{ github.sha }}"
      
      - name: Deployment failure notification
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Please check the logs."
